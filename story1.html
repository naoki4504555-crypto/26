<!DOCTYPE html>
<html lang="ja">
<head>
<script>
(function(){
  function isReload(){
    try{
      var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
      if(nav && nav.type === "reload") return true;
    }catch(e){}
    try{
      if(performance.navigation && performance.navigation.type === 1) return true;
    }catch(e){}
    return false;
  }
  if(isReload()){
    location.replace("./index.html");
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>STAGE 1 - ツルギ VS マモル</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --safe-bottom:env(safe-area-inset-bottom);
  --textbox-h:72px;
}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#000;color:white;overscroll-behavior:none;
}
body::before{
  content:"";position:fixed;inset:0;
  background:url('./bg_stage1_city.png?v=story-window-retry-20260506') center/cover no-repeat;
  z-index:0;
}
body::after{
  content:"";position:fixed;inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.04),rgba(0,0,0,.10) 44%,rgba(0,0,0,.46));
  z-index:1;pointer-events:none;
}
.scene{
  position:fixed;inset:0;z-index:2;width:100vw;height:100dvh;min-height:100svh;
  overflow:hidden;
  padding:calc(34px + env(safe-area-inset-top)) 0 calc(var(--textbox-h) + 16px + env(safe-area-inset-bottom));
}
.character-wrap{
  position:absolute;left:0;right:0;
  top:calc(8px + env(safe-area-inset-top));
  bottom:calc(var(--textbox-h) + 16px + env(safe-area-inset-bottom));
  display:flex;align-items:flex-start;justify-content:center;
  pointer-events:none;overflow:hidden;
}
.character{
  display:none;height:min(112vh,1120px);max-height:none;width:auto;max-width:min(96vw,720px);
  object-fit:contain;object-position:center top;
  filter:drop-shadow(0 18px 24px rgba(0,0,0,.55));
  user-select:none;-webkit-user-drag:none;animation:pop .16s ease-out;
}
.character.show{display:block;}
#tsurugi,#mamoru{transform:translateX(0) scale(1);}
.textbox{
  position:fixed;z-index:5;
  left:clamp(10px,3vw,30px);right:clamp(10px,3vw,30px);
  bottom:calc(10px + env(safe-area-inset-bottom));
  height:var(--textbox-h);min-height:var(--textbox-h);max-height:var(--textbox-h);
  padding:7px 12px 9px;
  border:3px solid rgba(255,255,255,.88);border-radius:15px;
  background:rgba(0,0,0,.82);
  box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 18px rgba(80,190,255,.18);
  overflow:hidden;
}
.dialog-main{
  display:grid;
  grid-template-rows:20px 1fr;
  gap:3px;
  height:100%;
  padding-right:52px;
}
.nameplate{
  justify-self:start;
  display:inline-flex;align-items:center;justify-content:center;
  height:20px;min-width:58px;
  margin:0;padding:1px 9px;
  border-radius:999px;border:2px solid #fff;
  font-size:11px;line-height:1;font-weight:1000;text-align:center;
  text-shadow:0 1px 0 #000;box-shadow:0 1px 0 rgba(0,0,0,.5);
}
.nameplate.tsurugi{background:linear-gradient(#ff5a3d,#a40000);}
.nameplate.mamoru{background:linear-gradient(#6b42ff,#251067);}
#text{
  display:block;
  height:calc(1.18em * 2);
  max-height:calc(1.18em * 2);
  overflow:hidden;
  font-size:clamp(12px,2.9vw,17px);
  line-height:1.18;
  font-weight:900;
  white-space:pre-line;
  overflow-wrap:anywhere;
  text-shadow:0 2px 0 #000;
}
.next{
  position:absolute;right:12px;bottom:7px;
  font-size:10px;line-height:1;font-weight:900;color:#fff7a6;
  animation:blink .9s infinite alternate;
}
.back{
  position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:8;
  border:2px solid rgba(255,255,255,.85);background:rgba(0,0,0,.60);color:#fff;
  border-radius:999px;padding:9px 14px;font-weight:1000;
}
@keyframes blink{from{opacity:.35}to{opacity:1}}
@keyframes pop{from{opacity:.25;transform:translateY(8px) scale(.99)}to{opacity:1}}
@media (orientation:landscape){
  :root{--textbox-h:66px;}
  .scene{padding-top:calc(26px + env(safe-area-inset-top));padding-bottom:calc(var(--textbox-h) + 12px + env(safe-area-inset-bottom));}
  .character-wrap{top:calc(2px + env(safe-area-inset-top));bottom:calc(var(--textbox-h) + 12px + env(safe-area-inset-bottom));}
  .character{height:118vh;max-width:min(44vw,520px);}
  .textbox{bottom:calc(7px + env(safe-area-inset-bottom));padding:6px 11px 8px;}
  .dialog-main{grid-template-rows:18px 1fr;gap:2px;padding-right:48px;}
  .nameplate{height:18px;min-width:54px;font-size:10px;padding:1px 8px;}
  #text{font-size:clamp(11px,1.8vw,15px);line-height:1.12;height:calc(1.12em * 2);max-height:calc(1.12em * 2);}
  .next{bottom:6px;font-size:9px;}
  .back{top:calc(8px + env(safe-area-inset-top));padding:7px 12px;font-size:13px;}
}
@media (max-width:520px) and (orientation:portrait){
  :root{--textbox-h:70px;}
  .textbox{left:9px;right:9px;padding:6px 10px 8px;}
  .dialog-main{grid-template-rows:19px 1fr;gap:2px;padding-right:48px;}
  .nameplate{height:19px;font-size:10px;min-width:54px;}
  #text{font-size:clamp(12px,3.35vw,15px);line-height:1.14;height:calc(1.14em * 2);max-height:calc(1.14em * 2);}
  .character{height:108vh;max-width:98vw;}
}
@media (max-height:430px){
  :root{--textbox-h:60px;}
  .textbox{padding:5px 10px 7px;}
  .dialog-main{grid-template-rows:16px 1fr;gap:1px;padding-right:44px;}
  .nameplate{height:16px;font-size:9px;min-width:50px;border-width:1px;}
  #text{font-size:clamp(10px,1.7vw,13px);line-height:1.08;height:calc(1.08em * 2);max-height:calc(1.08em * 2);}
  .next{bottom:5px;font-size:8px;}
  .character{height:118vh;max-width:min(40vw,430px);}
}
</style>
</head>
<body>
<button class="back" onclick="backToStory(event)">← ステージ選択</button>
<div class="scene" id="scene">
  <div class="character-wrap">
    <img id="tsurugi" class="character" src="./tsurugi.png?v=pngonly-20260503b" alt="ツルギ">
    <img id="mamoru" class="character" src="./mamoru.png?v=pngonly-20260503b" alt="マモル">
  </div>
  <div class="textbox" id="textbox">
    <div class="dialog-main">
      <div id="name" class="nameplate tsurugi">ツルギ</div>
      <div id="text"></div>
    </div>
    <div class="next">TAP ▶</div>
  </div>
</div>
<script>
const lines = [
  {speaker:'ツルギ', text:`たった一本のダガーをハートに秘めているか？`},
  {speaker:'ツルギ', text:`よお！俺の名前はツルギ！`},
  {speaker:'ツルギ', text:`超絶シンプル読み合いバトル！「ハート＆ダガー」で天下をとる男だ！`},
  {speaker:'ツルギ', text:`全国のハーダガリストをなぎ倒して、必ずハーダガマスターになってやる！`},
  {speaker:'マモル', text:`相変わらずでかい独り言だな。
ツルギ。`},
  {speaker:'ツルギ', text:`げっ！いたのかマモル！`},
  {speaker:'マモル', text:`少しよからぬ情報を入手してな。`},
  {speaker:'マモル', text:`ハーダガ四天王が本格的にこの街を制圧しようとしているらしい。`},
  {speaker:'マモル', text:`なんとしてもヤツらを止めねばならん。`},
  {speaker:'ツルギ', text:`ハーダガ四天王ってあのめちゃくちゃ強い4人組だろ？？`},
  {speaker:'ツルギ', text:`俺もいっしょに行くぜ！`},
  {speaker:'マモル', text:`ふん。
ハーダガリストが馴れ合いとは笑わせてくれるな。`},
  {speaker:'マモル', text:`あいつらは俺1人で止めてみせる。`},
  {speaker:'ツルギ', text:`ちぇっ！
かわいげのないやつ！`},
  {speaker:'マモル', text:`だがお前と久々に勝負してやらんこともないぞ。
ツルギも四天王もまとめて倒す。`},
  {speaker:'マモル', text:`ハーダガマスターになるのはこの俺だ。`},
  {speaker:'ツルギ', text:`おもしれーじゃん！！
早速勝負しようぜ！`}
];
let idx = 0;
let clickAudioCtx = null;
let inputLocked = false;
let lastAdvanceAt = 0;

function getClickAudioCtx(){
  if(!clickAudioCtx) clickAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(clickAudioCtx.state === 'suspended') clickAudioCtx.resume();
  return clickAudioCtx;
}
function playClick(){
  try{
    const ctx=getClickAudioCtx(); const now=ctx.currentTime;
    const osc=ctx.createOscillator(); const gain=ctx.createGain();
    osc.type='square';
    osc.frequency.setValueAtTime(980,now);
    osc.frequency.exponentialRampToValueAtTime(1460,now+0.055);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.36,now+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+0.14);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now+0.15);
  }catch(e){}
}
function renderLine(){
  const line = lines[idx];
  if(!line) return;
  const isT = line.speaker === 'ツルギ';
  const tsurugi = document.getElementById('tsurugi');
  const mamoru = document.getElementById('mamoru');
  tsurugi.classList.toggle('show', isT);
  mamoru.classList.toggle('show', !isT);
  const name = document.getElementById('name');
  name.textContent = line.speaker;
  name.className = 'nameplate ' + (isT ? 'tsurugi' : 'mamoru');
  document.getElementById('text').textContent = line.text;
}
function advanceStory(){
  const now = Date.now();
  if(inputLocked || now - lastAdvanceAt < 140) return;
  inputLocked = true;
  lastAdvanceAt = now;
  playClick();
  idx += 1;
  if(idx >= lines.length){
    sessionStorage.setItem('hd_story_stage','1');
    setTimeout(()=>{ location.href='./freebattle.html'; },170);
    return;
  }
  renderLine();
  setTimeout(()=>{ inputLocked = false; },80);
}
function backToStory(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  playClick();
  setTimeout(()=>{ location.href='./index.html#story'; },150);
}
window.addEventListener('DOMContentLoaded', () => {
  renderLine();
  // pointerup is stable across PC, tablet, and smartphone browsers.
  document.body.addEventListener('pointerup', (e) => {
    if(e.target && e.target.closest && e.target.closest('.back')) return;
    advanceStory();
  });
  // Fallback for very old iOS/Safari where pointer events may be incomplete.
  document.body.addEventListener('touchend', (e) => {
    if(e.target && e.target.closest && e.target.closest('.back')) return;
    e.preventDefault();
    advanceStory();
  }, {passive:false});
  document.body.addEventListener('click', (e) => {
    if(e.target && e.target.closest && e.target.closest('.back')) return;
    advanceStory();
  });
});
</script>
</body>
</html>
