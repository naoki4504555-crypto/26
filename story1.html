<!DOCTYPE html>
<html lang="ja">
<head>
<script>
(function(){
  function isReload(){
    try{
      var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
      if(nav && nav.type === "reload") return true;
    }catch(e){}
    try{
      if(performance.navigation && performance.navigation.type === 1) return true;
    }catch(e){}
    return false;
  }
  if(isReload()){
    location.replace("./index.html");
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>STAGE 1 - ツルギ VS マモル</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --safe-bottom:env(safe-area-inset-bottom);
  --textbox-h:88px;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#000;
  color:white;
  overscroll-behavior:none;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url('./bg_stage1_city.png?v=story-window-rebuilt-20260506') center/cover no-repeat;
  z-index:0;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.04),rgba(0,0,0,.10) 44%,rgba(0,0,0,.46));
  z-index:1;
  pointer-events:none;
}
.scene{
  position:fixed;
  inset:0;
  z-index:2;
  width:100vw;
  height:100dvh;
  min-height:100svh;
  overflow:hidden;
  padding:calc(40px + env(safe-area-inset-top)) 0 calc(var(--textbox-h) + 18px + env(safe-area-inset-bottom));
}
.character-wrap{
  position:absolute;
  left:0;
  right:0;
  top:calc(8px + env(safe-area-inset-top));
  bottom:calc(var(--textbox-h) + 18px + env(safe-area-inset-bottom));
  display:flex;
  align-items:flex-start;
  justify-content:center;
  pointer-events:none;
  overflow:hidden;
}
.character{
  display:none;
  height:min(112vh,1120px);
  max-height:none;
  width:auto;
  max-width:min(96vw,720px);
  object-fit:contain;
  object-position:center top;
  filter:drop-shadow(0 18px 24px rgba(0,0,0,.55));
  user-select:none;
  -webkit-user-drag:none;
  animation:pop .16s ease-out;
}
.character.show{display:block;}
#tsurugi,#mamoru{transform:translateX(0) scale(1);}
.textbox{
  position:fixed;
  z-index:5;
  left:clamp(10px,3vw,30px);
  right:clamp(10px,3vw,30px);
  bottom:calc(12px + env(safe-area-inset-bottom));
  width:auto;
  height:var(--textbox-h);
  min-height:var(--textbox-h);
  max-height:var(--textbox-h);
  overflow:hidden;
  padding:8px 14px 14px;
  border:3px solid rgba(255,255,255,.88);
  border-radius:16px;
  background:rgba(0,0,0,.82);
  box-shadow:0 6px 0 rgba(0,0,0,.45),0 0 22px rgba(80,190,255,.20);
}
.nameplate{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:72px;
  height:24px;
  margin:0 0 4px;
  padding:2px 10px;
  border-radius:999px;
  border:2px solid #fff;
  font-size:13px;
  line-height:1;
  font-weight:1000;
  text-align:center;
  text-shadow:0 1px 0 #000;
  box-shadow:0 2px 0 rgba(0,0,0,.5);
}
.nameplate.tsurugi{background:linear-gradient(#ff5a3d,#a40000);}
.nameplate.mamoru{background:linear-gradient(#6b42ff,#251067);}
#text{
  display:block;
  height:calc(1.22em * 2);
  max-height:calc(1.22em * 2);
  overflow:hidden;
  font-size:clamp(13px,3vw,18px);
  line-height:1.22;
  font-weight:900;
  white-space:pre-line;
  overflow-wrap:anywhere;
  text-shadow:0 2px 0 #000;
}
.next{
  position:absolute;
  right:14px;
  bottom:4px;
  font-size:10px;
  line-height:1;
  font-weight:900;
  color:#fff7a6;
  animation:blink .9s infinite alternate;
}
.back{
  position:fixed;
  left:12px;
  top:calc(12px + env(safe-area-inset-top));
  z-index:8;
  border:2px solid rgba(255,255,255,.85);
  background:rgba(0,0,0,.60);
  color:#fff;
  border-radius:999px;
  padding:9px 14px;
  font-weight:1000;
}
@keyframes blink{from{opacity:.35}to{opacity:1}}
@keyframes pop{from{opacity:.25;transform:translateY(8px) scale(.99)}to{opacity:1}}
@media (orientation:landscape){
  :root{--textbox-h:82px;}
  .scene{padding-top:calc(28px + env(safe-area-inset-top));}
  .character-wrap{top:calc(2px + env(safe-area-inset-top));bottom:calc(var(--textbox-h) + 14px + env(safe-area-inset-bottom));}
  .character{height:118vh;max-width:min(44vw,520px);}
  .textbox{
    left:clamp(8px,4vw,42px);
    right:clamp(8px,4vw,42px);
    bottom:calc(8px + env(safe-area-inset-bottom));
    padding:7px 13px 12px;
  }
  .nameplate{height:22px;min-width:66px;font-size:12px;margin-bottom:3px;}
  #text{font-size:clamp(12px,1.9vw,16px);line-height:1.18;height:calc(1.18em * 2);max-height:calc(1.18em * 2);}
  .next{bottom:4px;font-size:10px;}
  .back{top:calc(8px + env(safe-area-inset-top));padding:7px 12px;font-size:13px;}
}
@media (max-width:520px) and (orientation:portrait){
  :root{--textbox-h:86px;}
  .character{height:108vh;max-width:98vw;}
  .textbox{left:10px;right:10px;padding:7px 12px 13px;}
  .nameplate{height:23px;font-size:12px;min-width:66px;margin-bottom:3px;}
  #text{font-size:clamp(13px,3.6vw,16px);line-height:1.20;height:calc(1.20em * 2);max-height:calc(1.20em * 2);}
}
@media (max-height:430px){
  :root{--textbox-h:76px;}
  .textbox{padding:6px 12px 11px;}
  .nameplate{height:20px;font-size:11px;min-width:62px;margin-bottom:2px;}
  #text{font-size:clamp(11px,1.9vw,14px);line-height:1.15;height:calc(1.15em * 2);max-height:calc(1.15em * 2);}
  .character{height:118vh;max-width:min(40vw,430px);}
}
</style>
</head>
<body>
<button class="back" onclick="backToStory(event)">← ステージ選択</button>
<div class="scene" id="scene">
  <div class="character-wrap">
    <img id="tsurugi" class="character" src="./tsurugi.png?v=pngonly-20260503b" alt="ツルギ">
    <img id="mamoru" class="character" src="./mamoru.png?v=pngonly-20260503b" alt="マモル">
  </div>
  <div class="textbox" id="textbox">
    <div id="name" class="nameplate tsurugi">ツルギ</div>
    <div id="text"></div>
    <div class="next">TAP ▶</div>
  </div>
</div>
<script>
const lines = [
  {speaker:'ツルギ', text:`たった一本のダガーをハートに秘めているか？`},
  {speaker:'ツルギ', text:`よお！俺の名前はツルギ！`},
  {speaker:'ツルギ', text:`超絶シンプル読み合いバトル！「ハート＆ダガー」で天下をとる男だ！`},
  {speaker:'ツルギ', text:`全国のハーダガリストをなぎ倒して、必ずハーダガマスターになってやる！`},
  {speaker:'マモル', text:`相変わらずでかい独り言だな。
ツルギ。`},
  {speaker:'ツルギ', text:`げっ！いたのかマモル！`},
  {speaker:'マモル', text:`少しよからぬ情報を入手してな。`},
  {speaker:'マモル', text:`ハーダガ四天王が本格的にこの街を制圧しようとしているらしい。`},
  {speaker:'マモル', text:`なんとしてもヤツらを止めねばならん。`},
  {speaker:'ツルギ', text:`ハーダガ四天王ってあのめちゃくちゃ強い4人組だろ？？`},
  {speaker:'ツルギ', text:`俺もいっしょに行くぜ！`},
  {speaker:'マモル', text:`ふん。
ハーダガリストが馴れ合いとは笑わせてくれるな。`},
  {speaker:'マモル', text:`あいつらは俺1人で止めてみせる。`},
  {speaker:'ツルギ', text:`ちぇっ！
かわいげのないやつ！`},
  {speaker:'マモル', text:`だがお前と久々に勝負してやらんこともないぞ。
ツルギも四天王もまとめて倒す。`},
  {speaker:'マモル', text:`ハーダガマスターになるのはこの俺だ。`},
  {speaker:'ツルギ', text:`おもしれーじゃん！！
早速勝負しようぜ！`}
];
let idx = 0;
let clickAudioCtx = null;
let inputLocked = false;
let lastAdvanceAt = 0;

function getClickAudioCtx(){
  if(!clickAudioCtx) clickAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(clickAudioCtx.state === 'suspended') clickAudioCtx.resume();
  return clickAudioCtx;
}
function playClick(){
  try{
    const ctx=getClickAudioCtx(); const now=ctx.currentTime;
    const osc=ctx.createOscillator(); const gain=ctx.createGain();
    osc.type='square';
    osc.frequency.setValueAtTime(980,now);
    osc.frequency.exponentialRampToValueAtTime(1460,now+0.055);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.36,now+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+0.14);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now+0.15);
  }catch(e){}
}
function renderLine(){
  const line = lines[idx];
  if(!line) return;
  const isT = line.speaker === 'ツルギ';
  const tsurugi = document.getElementById('tsurugi');
  const mamoru = document.getElementById('mamoru');
  tsurugi.classList.toggle('show', isT);
  mamoru.classList.toggle('show', !isT);
  const name = document.getElementById('name');
  name.textContent = line.speaker;
  name.className = 'nameplate ' + (isT ? 'tsurugi' : 'mamoru');
  document.getElementById('text').textContent = line.text;
}
function advanceStory(){
  const now = Date.now();
  if(inputLocked || now - lastAdvanceAt < 140) return;
  inputLocked = true;
  lastAdvanceAt = now;
  playClick();
  idx += 1;
  if(idx >= lines.length){
    sessionStorage.setItem('hd_story_stage','1');
    setTimeout(()=>{ location.href='./freebattle.html'; },170);
    return;
  }
  renderLine();
  setTimeout(()=>{ inputLocked = false; },80);
}
function backToStory(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  playClick();
  setTimeout(()=>{ location.href='./index.html#story'; },150);
}
window.addEventListener('DOMContentLoaded', () => {
  renderLine();
  // pointerup is stable across PC, tablet, and smartphone browsers.
  document.body.addEventListener('pointerup', (e) => {
    if(e.target && e.target.closest && e.target.closest('.back')) return;
    advanceStory();
  });
  // Fallback for very old iOS/Safari where pointer events may be incomplete.
  document.body.addEventListener('touchend', (e) => {
    if(e.target && e.target.closest && e.target.closest('.back')) return;
    e.preventDefault();
    advanceStory();
  }, {passive:false});
  document.body.addEventListener('click', (e) => {
    if(e.target && e.target.closest && e.target.closest('.back')) return;
    advanceStory();
  });
});
</script>
</body>
</html>
